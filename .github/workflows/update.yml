name: Update AUR packages

# Daily: bump the upstream-tracking packages (llama.cpp-sycl-bin,
# openvino-genai-bin) to the latest release and push any change to its AUR repo.
# The intel-llm / intel-llm-convert packages are versioned by hand.
#
# Every tracking package is its own matrix leg with fail-fast disabled, so a
# package that no-ops, or whose upstream is broken, reports its own result and
# cannot freeze the bump for any other package.
on:
  schedule:
    - cron: '23 5 * * *'   # daily 05:23 UTC
  workflow_dispatch: {}

concurrency: { group: update-aur, cancel-in-progress: false }

permissions:
  contents: read

jobs:
  bump:
    name: bump ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 15
    # The bot commits the new pkgver back to main; the default repository token
    # is read-only, so the write scope has to be requested explicitly here.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Serial: every leg pushes to main, so overlapping legs would race on the
      # same branch. Isolation comes from fail-fast, not from parallelism.
      max-parallel: 1
      matrix:
        include:
          - pkg: llama.cpp-sycl-bin
            script: scripts/bump-llama-sycl.sh
            extra: llama-sycl
          - pkg: openvino-genai-bin
            script: scripts/bump-openvino-genai.sh
            extra: ''
    steps:
      - name: Tooling
        run: pacman -Sy --noconfirm --needed git jq pacman-contrib openssh python

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Build user (makepkg refuses root)
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: SSH for AUR
        env: { AUR_SSH_KEY: '${{ secrets.AUR_SSH_KEY }}' }
        run: |
          install -dm700 /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> /home/builder/.ssh/known_hosts 2>/dev/null
          cat > /home/builder/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF
          chown -R builder:builder /home/builder/.ssh

      - name: Bump and publish ${{ matrix.pkg }}
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          PKG: '${{ matrix.pkg }}'
          SCRIPT: '${{ matrix.script }}'
          EXTRA: '${{ matrix.extra }}'
        run: |
          set -euo pipefail
          cat > /tmp/bump-one.sh <<'BUMP_EOF'
          #!/usr/bin/env bash
          # Publish exactly one tracking package. Reads PKG / SCRIPT / EXTRA from
          # the environment. Every write is idempotent: the repo commit and the
          # AUR commit are both skipped when the tree already carries the version,
          # so a rerun over an already-published version is a clean no-op instead
          # of an "nothing to commit" exit 1.
          set -euo pipefail

          git config --global user.name  aur-bot
          git config --global user.email admin+aur@sys.corbet.ch

          bash "$SCRIPT"

          cd "packages/$PKG"
          if git diff --quiet -- PKGBUILD .SRCINFO; then
            echo "$PKG: unchanged"
            exit 0
          fi
          ver="$(sed -nE 's/^pkgver=(.*)$/\1/p' PKGBUILD)"
          echo "$PKG: publishing $ver"

          # 1. Record the bump in this repository.
          git add -A -- PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "$PKG: repo already at $ver"
          else
            git commit -m "$PKG: update to $ver"
          fi

          # 2. Mirror it into the AUR repository. The AUR side can already carry
          #    $ver from an earlier run whose repo push did not land.
          rm -rf "/tmp/aur-$PKG"
          git clone "ssh://aur@aur.archlinux.org/$PKG.git" "/tmp/aur-$PKG"
          cp PKGBUILD .SRCINFO "/tmp/aur-$PKG/"
          if [ -n "$EXTRA" ]; then cp $EXTRA "/tmp/aur-$PKG/"; fi
          cd "/tmp/aur-$PKG"
          git add -A
          if git diff --cached --quiet; then
            echo "$PKG: AUR already at $ver"
          else
            git commit -m "update to $ver"
            git push
          fi
          BUMP_EOF
          chmod 0755 /tmp/bump-one.sh
          sudo -u builder \
            env GITHUB_TOKEN="$GITHUB_TOKEN" PKG="$PKG" SCRIPT="$SCRIPT" EXTRA="$EXTRA" \
            bash /tmp/bump-one.sh

      - name: Push repo commit for ${{ matrix.pkg }}
        run: |
          set -euo pipefail
          sudo -u builder bash -euo pipefail -c '
            git fetch origin main
            if [ -z "$(git log --oneline origin/main..HEAD)" ]; then
              echo "nothing to push"
              exit 0
            fi
            # A failed push must be loud: a silenced 403 here froze main for a
            # month, which in turn made every later run recompute the same diff.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "pushed to main"
                exit 0
              fi
              echo "push attempt $attempt failed, retrying" >&2
              sleep 5
            done
            echo "push to main failed after 3 attempts" >&2
            exit 1
          '
